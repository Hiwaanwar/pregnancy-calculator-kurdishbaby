<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بەخێربێن 🌸</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/welcome.css">
</head>
<body class="welcome-page">

    <div class="welcome-container">
        <!-- الشعار المتحرك -->
        <div class="welcome-logo">
            <div class="logo-circle">🌸</div>
            <div class="logo-float">👶</div>
        </div>

        <!-- العنوان -->
        <h1 class="welcome-title">ژمێرەری دووگیانی</h1>
        <p class="welcome-subtitle">هاوڕێی تۆ لە ماوەی دووگیانیدا 💕</p>

        <!-- الميزات -->
        <div class="features-list">
            <div class="feature-item">
                <span class="feature-icon">📅</span>
                <span>ڕێنیشاندەری ڕۆژانەی دووگیانی</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">💡</span>
                <span>ئامۆژگاری تایبەت بۆ هەر هەفتەیەک</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">👶</span>
                <span>زانیاری قەبارەی منداڵەکەت</span>
            </div>
        </div>

        <!-- زر البداية -->
        <button class="btn-start" onclick="startApp()">
            دەستپێکردن ✨
        </button>

        <p class="welcome-note">تەنها جارێک زانیاریەکانت پێویستە</p>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/welcome.js"></script>
</body>
</html>
