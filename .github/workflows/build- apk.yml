name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova and create project
        run: |
          npm install -g cordova
          cordova create build com.hiwaanwar.pregnancy PregnancyCalc
          cd build
          cordova platform add android

      - name: Install AdMob Plugin
        run: |
          cd build
          cordova plugin add cordova-plugin-admob-free --variable ADMOB_APP_ID="ca-app-pub-9868815971759940~6911158089" --save

      - name: Copy web files to build
        run: |
          cp -r index.html welcome.html setup.html css js build/www/ 2>/dev/null || true
          cp -r assets build/www/ 2>/dev/null || true
          rm -f build/www/index.html
          cp index.html build/www/index.html

      - name: Build APK
        run: |
          cd build
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pregnancy-calculator-apk
          path: build/platforms/android/app/build/outputs/apk/debug/*.apk
